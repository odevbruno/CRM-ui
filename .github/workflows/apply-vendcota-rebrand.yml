name: Apply VendCota rebrand

on:
  push:
    branches: [refactor/vendcota-design-system]

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/vendcota-design-system
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply product rename
        run: node crm-ui/scripts/rebrand-product.js --old-name CotaFlow --new-name VendCota --old-slug cotaflow --new-slug vendcota
      - name: Verify branding contract
        run: node --test crm-ui/tests/*.test.js
      - name: Commit generated rebrand
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: rebrand design system to VendCota"
          git push origin HEAD:refactor/vendcota-design-system
